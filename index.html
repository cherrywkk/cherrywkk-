<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>王康 · 个人主页</title>
  <meta name="description" content="王康的个人主页与联系信息。">
  <style>
    :root { color-scheme: light; --ink:#173b3a; --accent:#18776b; --muted:#64716e; --line:#dbe5e1; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f4f7f5; color:var(--ink); font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; line-height:1.75; }
    .wrap { max-width:920px; margin:0 auto; padding:44px 24px; }
    .eyebrow { font-size:12px; letter-spacing:.18em; color:var(--accent); margin:0 0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:42px; box-shadow:0 12px 45px #173b3a08; }
    h1 { margin:0 0 8px; font-size:clamp(30px,5vw,48px); line-height:1.25; overflow-wrap:anywhere; }
    h2 { margin:0 0 16px; font-size:20px; }
    .subtitle { color:var(--muted); margin:0 0 28px; }
    .badge { display:inline-block; color:#8a601d; background:#fbf1df; border-radius:8px; padding:5px 12px; font-size:13px; margin-bottom:22px; }
    .section { border-top:1px solid var(--line); padding-top:24px; margin-top:28px; }
    .bio { white-space:pre-wrap; overflow-wrap:anywhere; }
    p { margin:0 0 14px; }
    a { color:var(--accent); text-underline-offset:4px; overflow-wrap:anywhere; }
    .email { font-size:18px; }
    footer { margin-top:32px; font-size:13px; color:var(--muted); }
    .editor { margin-top:32px; background:#edf3f0; border:1px solid var(--line); border-radius:16px; padding:28px; }
    .hint { color:var(--muted); font-size:14px; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:20px 0; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .wide { grid-column:1 / -1; }
    label { font-size:14px; font-weight:600; }
    input,textarea { width:100%; font:inherit; color:var(--ink); background:white; border:1px solid #b7cbc3; border-radius:8px; padding:10px 12px; }
    input:focus,textarea:focus { outline:2px solid #66a99a; outline-offset:2px; }
    textarea { min-height:100px; resize:vertical; }
    button { font:inherit; font-weight:600; border:0; border-radius:9px; padding:11px 20px; background:var(--ink); color:white; cursor:pointer; }
    button:focus-visible { outline:3px solid #66a99a; outline-offset:3px; }
    .consent { display:flex; gap:10px; align-items:flex-start; font-weight:400; margin-bottom:18px; }
    .consent input { width:auto; margin-top:7px; flex:none; }
    #status { margin-top:14px; color:#806020; font-size:14px; }
    code { padding:2px 5px; border-radius:4px; background:#e0eae5; font-size:13px; }
    details { margin-top:22px; border-top:1px solid #cdded6; padding-top:18px; }
    summary { cursor:pointer; font-weight:600; margin-bottom:12px; }
    [hidden] { display:none !important; }
    @media(max-width:600px) { .wrap { padding:28px 16px; } .card { padding:28px 22px; } .editor { padding:22px; } .fields { grid-template-columns:1fr; } }
    @media print { body { background:#fff; } .editor,.badge { display:none; } .card { border:0; box-shadow:none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" id="profile">
      <p class="eyebrow">PERSONAL HOMEPAGE</p>
      
      <h1 id="profile-name">王康</h1>
      <p class="subtitle" id="profile-affiliation">北京师范大学</p>
      <section class="section" id="bio-section">
        <h2>关于我</h2>
        <p class="bio" id="profile-bio">统计学专业</p>
      </section>
      <section class="section" aria-labelledby="contact-title">
        <h2 id="contact-title">联系邮箱</h2>
        <p class="email"><a id="profile-email" href="mailto:superwkk%40163.com">superwkk@163.com</a></p>
      </section>
      <footer>个人主页</footer>
    </main>
    
  </div>
  


</body></html>
